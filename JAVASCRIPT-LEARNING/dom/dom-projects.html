<!DOCTYPE html>
<html>

<head>
    <title>DOM Projects</title>

    <style>
        .subscribe-button {
            border: none;
            background-color: black;
            color: white;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 12px;
            padding-right: 12px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .is-subscribed {
            background-color: rgb(240, 240, 240);
            color: black;
        }

        .celebration {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: gold;
            color: black;
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            animation: fadeUp 1.5s ease forwards;
            z-index: 1000;
        }
    </style>
</head>

<body>
    <p>YouTube Subscribe Button</p>
    <button onclick="subscribe();" class="js-subscribe-button subscribe-button">
        Subscribe
    </button>

    <p>Amazon Shipping Calculator</p>
    <input placeholder="Cost of order" class="js-cost-input" onkeydown="
      handleCostKeydown(event);
    ">
    <button onclick="calculateTotal();">Calculate</button>
    <p class="js-total-cost"></p>

    <script>
        function handleCostKeydown(event) {
            if (event.key === 'Enter') {
                calculateTotal();
            }
        }

        function calculateTotal() {
            const inputElement = document.querySelector('.js-cost-input');
            let cost = Number(inputElement.value);

            if (cost < 40) {
                cost = cost + 10;
            }

            document.querySelector('.js-total-cost').innerHTML = `$${cost}`;
        }

        function showCelebration() {
            const message = document.createElement('div');
            message.classList.add('celebration');
            message.innerHTML = '🎉 Subscribed! 🎉';

            document.body.appendChild(message);

            setTimeout(() => {
                message.remove();
            }, 1500);
        }

        function subscribe() {
            const buttonElement = document.querySelector('.js-subscribe-button');

            if (buttonElement.innerText === 'Subscribe') {
                buttonElement.innerHTML = 'Subscribed';
                buttonElement.classList.add('is-subscribed');
                buttonElement.classList.add('pop');

                showCelebration();

                setTimeout(() => {
                    buttonElement.classList.remove('pop');
                }, 300);

            } else {
                buttonElement.innerHTML = 'Subscribe';
                buttonElement.classList.remove('is-subscribed');
            }
        }
    </script>
</body>

</html>
